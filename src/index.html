<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1b21">
<title>Find Your Car</title>
<style>/*CSS*/</style>
</head>
<body>
<div id="app">
  <header class="appbar">
    <div class="appbar-title" id="title">Find Your Car</div>
    <div class="chip" id="scoreChip" hidden><span class="material-dot"></span><span id="scoreText">0 / 10</span></div>
    <button class="icon-btn" id="lbBtn" aria-label="Leaderboard"><svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 0 0 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg></button>
    <button class="icon-btn" id="musicBtn" aria-label="Toggle music"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></button>
    <button class="icon-btn" id="muteBtn" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path id="muteIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
    <div class="music-dropdown" id="musicDropdown" hidden>
      <div class="music-track-info">
        <span class="music-note-icon">♪</span>
        <span class="music-track-title" id="musicDropdownTitle">Track Title</span>
      </div>
      <div class="music-ctrls">
        <button class="icon-btn" id="musicToggleBtn" aria-label="Play/Pause">
          <svg viewBox="0 0 24 24" id="musicToggleIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="icon-btn" id="musicSkipBtn" aria-label="Next Track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="progress" id="progress" hidden><div class="progress-bar" id="progressBar"></div></div>
  <main class="stage"><canvas id="gl"></canvas><div class="loading" id="loading"><div class="spinner"></div><div>Parking the cars…</div></div></main>
  <section class="sheet" id="sheet"></section>
</div>
<div class="snackbar" id="snack" role="status"></div>
<script>/*JS*/</script>
</body>
</html>
